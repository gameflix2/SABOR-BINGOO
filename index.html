<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEFLIX BINGO | PRO SELECTION</title>
    <style>
        :root {
            --bg-dark: #020202;
            --neon-red: #ff0000;
            --gold: #d4af37;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Evita scroll lateral */
        }

        #bg-image {
            position: fixed; /* Fixed para não sumir no scroll do mobile */
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-image: url('https://casinoespana.club/wp-content/uploads/2024/02/bonos_de_bingo_banner.webp'); 
            filter: blur(12px) brightness(0.3);
        }

        #lobby {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-title { 
            font-size: 3rem; /* Reduzido para mobile */
            font-weight: 900; 
            margin-bottom: 30px; 
            color: var(--white);
            text-transform: uppercase;
        }
        .hero-title span { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }

        .selection-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap; /* Essencial para quebrar linha no mobile */
            max-width: 1200px;
        }

        .card-option {
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 20px;
            width: 220px; 
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .card-img-wrapper {
            width: 100%;
            height: 230px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* --- AJUSTES MOBILE (A MÁGICA ACONTECE AQUI) --- */
        @media (max-width: 768px) {
            body { overflow-y: auto; } /* Permite scroll vertical se os cards ocuparem muito espaço */
            
            .hero-title {
                font-size: 2.2rem; /* Título menor em telemóveis */
                margin-bottom: 20px;
            }

            .card-option {
                width: 100%; /* Card ocupa a largura quase toda no mobile */
                max-width: 300px;
                flex-direction: row; /* Coloca imagem ao lado do texto se preferir, ou manter column */
                flex-direction: column; 
            }

            .card-img-wrapper {
                height: 180px; /* Imagem um pouco menor no mobile para caber mais itens */
            }

            .selection-container {
                gap: 15px;
            }
        }

        .card-option:hover {
            border-color: var(--neon-red);
            transform: translateY(-8px);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.5);
            background: rgba(30, 0, 0, 0.4);
        }

        .card-option:hover img { transform: scale(1.1); }

        .card-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-sublabel {
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
        }

        footer { 
            text-align: center; 
            padding: 15px; 
            background: rgba(0,0,0,0.9); 
            font-size: 12px; 
            color: #444; 
            border-top: 1px solid #111;
            margin-top: auto; 
        }
        footer b { color: var(--gold); }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div id="lobby">
        <h1 class="hero-title">GAME<span>FLIX</span> BINGO</h1>
        
        <div class="selection-container">
            <div class="card-option" onclick="startGame(1)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731709/ChatGPT_Image_20_de_abr._de_2026_21_28_36_psllzv.png" alt="1 Cartela">
                </div>
                <div>
                    <div class="card-label">1 Cartela</div>
                    <div class="card-sublabel">Iniciante</div>
                </div>
            </div>

            <div class="card-option" onclick="startGame(2)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731702/ChatGPT_Image_20_de_abr._de_2026_21_31_03_kbenai.png" alt="2 Cartelas">
                </div>
                <div>
                    <div class="card-label">2 Cartelas</div>
                    <div class="card-sublabel">Avançado</div>
                </div>
            </div>

            <div class="card-option" onclick="startGame(3)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731713/ChatGPT_Image_20_de_abr._de_2026_21_28_36_-_Copia_2_lxl5xh.png" alt="3 Cartelas">
                </div>
                <div>
                    <div class="card-label">3 Cartelas</div>
                    <div class="card-sublabel">Modo Tubarão</div>
                </div>
            </div>

            <div class="card-option" onclick="startGame(4)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731704/ChatGPT_Image_20_de_abr._de_2026_21_26_35_bmgshy.png" alt="4 Cartelas">
                </div>
                <div>
                    <div class="card-label">4 Cartelas</div>
                    <div class="card-sublabel">Modo Lenda</div>
                </div>
            </div>
        </div>
    </div>

    <footer>Desenvolvido por <b>Yan Ferreira - GAMEFLIX</b> &copy; 2026.</footer>

    <script>
        function startGame(num) {
            alert("Iniciando arena para " + num + " cartelas...");
        }
    </script>
</body>
</html>
