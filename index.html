<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEFLIX BINGO | PRO SELECTION</title>
    <style>
        :root {
            --bg-dark: #020202;
            --neon-red: #ff0000;
            --gold: #d4af37;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-image: url('https://casinoespana.club/wp-content/uploads/2024/02/bonos_de_bingo_banner.webp'); 
            filter: blur(12px) brightness(0.3);
        }

        #lobby {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        .hero-title { font-size: 2rem; font-weight: 900; margin-bottom: 20px; color: var(--white); }
        .hero-title span { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }

        .selection-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 na mesma linha */
            gap: 8px;
            width: 100%;
            max-width: 1200px;
            padding: 0 5px;
        }

        .card-option {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* Proporção vertical mantida */
            min-height: 180px; 
        }

        .card-img-wrapper {
            width: 100%;
            height: 110px; /* Altura fixa para manter o card "esticado" */
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--gold);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            /* 'contain' garante que a foto apareça inteira sem cortes */
            object-fit: contain; 
            transition: transform 0.5s ease;
        }

        @media (min-width: 769px) {
            .hero-title { font-size: 4rem; }
            .card-img-wrapper { height: 230px; }
            .card-option { padding: 20px; min-height: 350px; border-width: 2px; }
            .selection-container { gap: 20px; }
            .card-label { font-size: 1.2rem; }
        }

        .card-option:active {
            border-color: var(--neon-red);
            transform: scale(0.95);
        }

        .card-label {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            margin-top: 5px;
            line-height: 1;
        }

        footer { text-align: center; padding: 10px; background: #000; font-size: 10px; color: #444; }
        footer b { color: var(--gold); }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div id="lobby">
        <h1 class="hero-title">DIONATAN<span>GAY</span> BINGO</h1>
        
        <div class="selection-container">
            <div class="card-option" onclick="startGame(1)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731709/ChatGPT_Image_20_de_abr._de_2026_21_28_36_psllzv.png">
                </div>
                <div class="card-label">1 Cartela</div>
            </div>

            <div class="card-option" onclick="startGame(2)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731702/ChatGPT_Image_20_de_abr._de_2026_21_31_03_kbenai.png">
                </div>
                <div class="card-label">2 Cartelas</div>
            </div>

            <div class="card-option" onclick="startGame(3)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731713/ChatGPT_Image_20_de_abr._de_2026_21_28_36_-_Copia_2_lxl5xh.png">
                </div>
                <div class="card-label">3 Cartelas</div>
            </div>

            <div class="card-option" onclick="startGame(4)">
                <div class="card-img-wrapper">
                    <img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731704/ChatGPT_Image_20_de_abr._de_2026_21_26_35_bmgshy.png">
                </div>
                <div class="card-label">4 Cartelas</div>
            </div>
        </div>
    </div>

    <footer>Desenvolvido por <b>Yan Ferreira - GAMEFLIX</b></footer>

    <script>
        function startGame(num) {
            alert("Iniciando arena para " + num + " cartelas...");
        }
    </script>
</body>
</html>
