<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial, Helvetica, sans-serif;
    background:#141414;
    color:white;
}

/* NAVBAR */
.navbar {
    position:fixed;
    top:0;
    width:100%;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    z-index:1000;
}

.logo {
    color:#e50914;
    font-size:28px;
    font-weight:bold;
}

.menu {
    display:flex;
    gap:20px;
    font-size:14px;
}

.menu span {
    cursor:pointer;
    transition:0.3s;
}

.menu span:hover {
    color:#b3b3b3;
}

/* BANNER */
.banner {
    height:60vh;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
    padding:60px;
    position:relative;
    margin-bottom:40px;
}

.banner::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, #141414 10%, transparent 60%);
}

.banner-content {
    position:relative;
    z-index:2;
    max-width:600px;
}

.banner h1 {
    font-size:50px;
    margin-bottom:10px;
}

.banner p {
    font-size:16px;
    margin-bottom:20px;
    color:#ddd;
}

/* ROWS */
.container {
    padding:0 50px 50px 50px;
}

.row {
    margin-bottom:40px;
}

.row h2 {
    margin-bottom:15px;
}

.row-posters {
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
}

.poster {
    width:200px;
    height:300px;
    background-size:cover;
    background-position:center;
    border-radius:4px;
    cursor:pointer;
    transition:transform 0.3s ease;
}

.poster:hover {
    transform:scale(1.1);
}

/* MODAL */
.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
}

.modal-content {
    width:60%;
    max-height:80%;
    position:relative;
    background:#141414;
    padding:20px;
    border-radius:8px;
    overflow-y:auto;
    color:white;
}

.close {
    position:absolute;
    top:10px;
    right:20px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">GAMEFLIX</div>
    <div class="menu">
        <span>Início</span>

        <span>Novidades</span>

    </div>
</div>

<!-- BANNER -->
<div class="banner" id="banner">
