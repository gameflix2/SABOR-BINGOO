<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEFLIX BINGO | 4 EM LINHA</title>
    <style>
        :root {
            --bg-dark: #020202;
            --neon-red: #ff0000;
            --gold: #d4af37;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-image: url('https://casinoespana.club/wp-content/uploads/2024/02/bonos_de_bingo_banner.webp'); 
            filter: blur(12px) brightness(0.3);
        }

        #lobby {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        .hero-title { 
            font-size: 1.8rem; /* Reduzido para não empurrar os cards */
            font-weight: 900; 
            margin-bottom: 20px; 
            color: var(--white);
            text-transform: uppercase;
        }
        .hero-title span { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        /* FORÇA 4 COLUNAS EM QUALQUER TELA */
        .selection-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 5px; /* Espaço mínimo entre cards */
            width: 100%;
            max-width: 1200px;
        }

        .card-option {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 8px 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .card-img-wrapper {
            width: 100%;
            height: 80px; /* Altura pequena para caber na linha mobile */
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--gold);
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AJUSTE PARA TELAS MAIORES (PC) */
        @media (min-width: 769px) {
            .hero-title { font-size: 4rem; }
            .card-img-wrapper { height: 230px; }
            .card-option { padding: 20px; gap: 15px; border-width: 2px; }
            .selection-container { gap: 20px; }
            .card-label { font-size: 1.2rem; }
        }

        .card-option:active {
            border-color: var(--neon-red);
            transform: scale(0.95);
        }

        .card-label {
            font-size: 0.65rem; /* Texto bem pequeno para caber na horizontal */
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            white-space: nowrap; /* Evita que o texto quebre linha */
        }

        .card-sublabel {
            display: none; /* Escondido no mobile para ganhar espaço vertical */
        }

        @media (min-width: 769px) {
            .card-sublabel { display: block; font-size: 0.75rem; color: var(--gold); }
        }

        footer { 
            text-align: center; 
            padding: 10px; 
            background: rgba(0,0,0,0.9); 
            font-size: 10px; 
            color: #444; 
        }
        footer b { color: var(--gold); }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div id="lobby">
        <h1 class="hero-title">GAME<span>FLIX</span> BINGO</h1>
        
        <div class="selection-container">
            <div class="card-option" onclick="startGame(1)">
                <div class="card-img-wrapper"><img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731709/ChatGPT_Image_20_de_abr._de_2026_21_28_36_psllzv.png"></div>
                <div class="card-label">1 Cartela</div>
                <div class="card-sublabel">Iniciante</div>
            </div>

            <div class="card-option" onclick="startGame(2)">
                <div class="card-img-wrapper"><img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731702/ChatGPT_Image_20_de_abr._de_2026_21_31_03_kbenai.png"></div>
                <div class="card-label">2 Cartelas</div>
                <div class="card-sublabel">Avançado</div>
            </div>

            <div class="card-option" onclick="startGame(3)">
                <div class="card-img-wrapper"><img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731713/ChatGPT_Image_20_de_abr._de_2026_21_28_36_-_Copia_2_lxl5xh.png"></div>
                <div class="card-label">3 Cartelas</div>
                <div class="card-sublabel">Tubarão</div>
            </div>

            <div class="card-option" onclick="startGame(4)">
                <div class="card-img-wrapper"><img src="https://res.cloudinary.com/dlt1gqwnc/image/upload/v1776731704/ChatGPT_Image_20_de_abr._de_2026_21_26_35_bmgshy.png"></div>
                <div class="card-label">4 Cartelas</div>
                <div class="card-sublabel">Lenda</div>
            </div>
        </div>
    </div>

    <footer>Desenvolvido por <b>Yan Ferreira - GAMEFLIX</b></footer>

    <script>
        function startGame(num) {
            alert("Iniciando arena para " + num + " cartelas...");
        }
    </script>
</body>
</html>
