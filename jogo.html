<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEFLIX | ARENA AO VIVO</title>
    <style>
        :root { 
            --bg-dark: #020202; 
            --neon-red: #ff0000; 
            --gold: #d4af37; 
            --white: #ffffff; 
            --card-bg: rgba(20, 20, 20, 0.95);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a0000 0%, #020202 100%);
        }

        .game-header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-mini { font-weight: 900; font-size: 1.8rem; letter-spacing: 2px; }
        .logo-mini span { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        .draw-panel {
            margin: 30px 0;
            text-align: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid var(--gold);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
        }

        .current-ball {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #000;
            font-weight: 900;
            margin: 15px auto;
            box-shadow: 0 0 30px var(--gold);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            width: 95%;
            max-width: 1300px;
            padding: 20px;
            margin-bottom: 100px;
        }

        .bingo-card {
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header { color: var(--gold); font-weight: 900; margin-bottom: 15px; border-bottom: 1px solid #333; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

        .cell {
            aspect-ratio: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.3rem;
            border-radius: 10px;
            border: 1px solid #333;
            color: #ccc;
            transition: 0.3s;
        }

        .cell.marked {
            background: linear-gradient(145deg, var(--neon-red), #800000);
            color: white;
            border-color: #fff;
            box-shadow: 0 0 15px var(--neon-red);
            transform: scale(0.95);
        }

        .cell.free { background: var(--gold); color: #000; font-size: 0.7rem; }

        #history-bar {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px;
            background: #000;
            border-top: 1px solid var(--gold);
        }
        
        .history-ball {
            display: inline-flex;
            width: 40px;
            height: 40px;
            background: #222;
            border: 1px solid var(--gold);
            border-radius: 50%;
            margin: 0 5px;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-weight: bold;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f0;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .dot { width: 8px; height: 8px; background: #0f0; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="logo-mini">GAME<span>FLIX</span></div>
        <div class="live-indicator"><div class="dot"></div> AO VIVO</div>
    </div>

    <div class="draw-panel">
        <div id="next-draw" style="font-size: 0.8rem; color: var(--gold);">PRÓXIMA BOLA EM: <span id="timer">--</span>s</div>
        <div class="current-ball" id="ball">-</div>
        <div id="status-msg" style="font-weight: bold; color: var(--gold);">Sincronizando...</div>
    </div>

    <div id="history-bar"></div>

    <div class="cards-container" id="cards-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const qtd = parseInt(urlParams.get('qtd')) || 1;
        const container = document.getElementById('cards-container');
        let drawnBalls = [];
        let lastBall = null;

        // Gerar cartelas (Semente fixa por dia para garantir que não mude no F5)
        for(let i = 1; i <= qtd; i++) createCard(i);

        function createCard(id) {
            const card = document.createElement('div');
            card.className = 'bingo-card';
            card.innerHTML = `<div class="card-header">Cartela #${id}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            // Lógica B-I-N-G-O Real
            let cardNums = [];
            for(let col=0; col<5; col++) {
                let start = (col * 15) + 1;
                let colNums = Array.from({length: 15}, (_, i) => i + start).sort(() => Math.random() - 0.5).slice(0, 5);
                cardNums.push(...colNums);
            }
            
            cardNums.forEach((num, index) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.setAttribute('data-num', num);
                if(index === 12) {
                    cell.innerText = "FREE";
                    cell.classList.add('free', 'marked');
                } else {
                    cell.innerText = num;
                }
                grid.appendChild(cell);
            });
            card.appendChild(grid);
            container.appendChild(card);
        }

        // --- LÓGICA AO VIVO (SINCRONIA POR TEMPO) ---
        function updateLiveGame() {
            const now = new Date();
            const secondsInDay = Math.floor(now.getTime() / 1000);
            const interval = 7; // Nova bola a cada 7 segundos
            const gameCycle = 75 * interval; 
            
            // Gera a sequência de bolas do dia baseada no tempo
            const seed = Math.floor(secondsInDay / gameCycle);
            let allBalls = Array.from({length: 75}, (_, i) => i + 1);
            
            // Shuffle determinístico
            let currentBallsOrder = shuffleWithSeed(allBalls, seed);
            
            const currentStep = Math.floor((secondsInDay % gameCycle) / interval);
            const timeLeft = interval - (secondsInDay % interval);
            
            document.getElementById('timer').innerText = timeLeft;

            drawnBalls = currentBallsOrder.slice(0, currentStep + 1);
            let currentBall = drawnBalls[drawnBalls.length - 1];

            if(currentBall !== lastBall) {
                lastBall = currentBall;
                renderGame(currentBall);
            }
        }

        function shuffleWithSeed(array, seed) {
            let m = array.length, t, i;
            while (m) {
                i = Math.floor(Math.abs(Math.sin(seed++)) * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        function renderGame(ball) {
            document.getElementById('ball').innerText = ball;
            document.getElementById('status-msg').innerText = "BOLA SORTEADA!";
            
            // Voz
            const msg = new SpeechSynthesisUtterance("Número " + ball);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);

            // Auto-Paque (Marca em todas as cartelas)
            document.querySelectorAll(`.cell[data-num="${ball}"]`).forEach(el => {
                el.classList.add('marked');
            });

            // Atualiza Histórico
            const hist = document.getElementById('history-bar');
            hist.innerHTML = '';
            drawnBalls.slice().reverse().forEach(b => {
                const h = document.createElement('div');
                h.className = 'history-ball';
                h.innerText = b;
                hist.appendChild(h);
            });
        }

        setInterval(updateLiveGame, 1000);
    </script>
</body>
</html>
